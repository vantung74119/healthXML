      animation-duration: 1.5s;

        // Simulate data fetching

        return softwareData.filter(item => {

      return (

          <Header darkMode={darkMode} setDarkMode={setDarkMode} />

          <main className="flex-1">
            {/* Hero Section */}
            <section className="relative pt-20 pb-16 px-4 overflow-hidden">
              <div className="absolute inset-0 bg-blue-50/50 dark:bg-blue-900/10 -z-10 transition-colors"></div>
              <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-64 bg-blue-400/20 dark:bg-blue-600/20 blur-[100px] rounded-full -z-10"></div>
              
              <div className="container mx-auto max-w-4xl text-center">
                <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-6">
                  Công Cụ Dữ Liệu <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-500">Y Tế & BHYT</span>
                </h1>
                <p className="text-lg md:text-xl text-gray-600 dark:text-gray-400 mb-10 max-w-2xl mx-auto">
                  Kho phần mềm chuyên dụng hỗ trợ kiểm tra XML, chuẩn hóa dữ liệu 130 và đồng bộ cổng giám định BHYT hiệu quả nhất.
                </p>

                {/* Search Bar */}
                <div className="relative max-w-2xl mx-auto mb-10 group">
                  <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
                    <Search className="w-5 h-5" />
                  </div>
                  <input 
                    type="text" 
                    className="w-full pl-14 pr-12 py-4 rounded-2xl border-2 border-white dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm shadow-xl shadow-blue-500/5 dark:shadow-blue-900/10 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all text-lg"
                    placeholder="Tìm kiếm nhanh phần mềm, tính năng..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  {searchQuery && (
                    <div className="absolute inset-y-0 right-0 pr-4 flex items-center">
                      <button onClick={() => setSearchQuery("")} className="p-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
                        <X className="w-5 h-5" />
                      </button>
                    </div>
                  )}
                </div>

                {/* Categories */}
                <div className="flex flex-wrap justify-center gap-3">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setActiveCategory(cat)}
                      className={`px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 ${
                        activeCategory === cat 
                          ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900 shadow-lg transform scale-105' 
                          : 'bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-800 hover:border-gray-300 dark:hover:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 shadow-sm'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>
            </section>

            {/* Software Grid */}
            <section className="py-8 px-4 container mx-auto max-w-7xl">
              <div className="mb-8 flex justify-between items-end">
                <div>
                  <h2 className="text-2xl font-bold text-gray-900 dark:text-white">Danh sách phần mềm</h2>
                  <p className="text-gray-500 dark:text-gray-400 mt-1">Hiển thị {isLoading ? "..." : filteredData.length} kết quả</p>
                </div>
              </div>

              {isLoading ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {[1, 2, 3].map(i => <SkeletonCard key={i} />)}
                </div>
              ) : filteredData.length > 0 ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredData.map(item => (
                    <SoftwareCard 
                      key={item.id} 
                      item={item} 
                      onOpenModal={setSelectedItem} 
                    />
                  ))}
                </div>
              ) : (
                <div className="text-center py-20 bg-white dark:bg-gray-900 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                  <div className="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                    <Search className="w-8 h-8" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-2">Không tìm thấy phần mềm nào</h3>
                  <p className="text-gray-500 dark:text-gray-400">Vui lòng thử từ khóa khác hoặc xóa bộ lọc danh mục.</p>
                  <button 
                    onClick={() => {setSearchQuery(""); setActiveCategory("Tất cả");}}
                    className="mt-6 px-6 py-2.5 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-medium rounded-xl hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors"
                  >
                    Xóa tất cả bộ lọc
                  </button>
                </div>
              )}
            </section>
          </main>

          <footer className="border-t border-gray-200 dark:border-gray-800 py-8 bg-white dark:bg-gray-950 mt-auto transition-colors">
            <div className="container mx-auto px-4 text-center text-gray-500 dark:text-gray-400 text-sm">
              <p>© 2024 HealthXML. All rights reserved. Designed and developed by Bùi Văn Tùng.</p>
            </div>
          </footer>

          <Modal 
            isOpen={!!selectedItem} 
            onClose={() => setSelectedItem(null)} 
            item={selectedItem} 
          />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
