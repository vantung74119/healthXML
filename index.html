                    <h3 className="text-lg font-semibold text-gray-900 dark:text-white mb-4">Hướng dẫn cài đặt nhanh</h3>
                    <div className="relative border-l-2 border-blue-100 dark:border-blue-900/50 ml-3 space-y-6">
                      <div className="relative pl-6">
                        <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-blue-500 border-4 border-gray-50 dark:border-gray-900"></div>
                        <h4 className="font-medium text-gray-900 dark:text-white text-sm">Bước 1: Tải và Giải nén</h4>
                        <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">Tải file cài đặt về máy, sau đó nhấp chuột phải chọn "Extract Here".</p>
                      </div>
                      <div className="relative pl-6">
                        <div className="absolute -left-[9px] top-1 w-4 h-4 rounded-full bg-blue-500 border-4 border-gray-50 dark:border-gray-900"></div>
                        <h4 className="font-medium text-gray-900 dark:text-white text-sm">Bước 2: Chạy File Cài Đặt</h4>
                        <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">Chạy file <code>setup.exe</code> với quyền Administrator và cài đặt.</p>
                      </div>
                    </div>
                  </section>
                </div>
                <div className="space-y-6">
                  <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 shadow-sm">
                    <h4 className="text-sm font-semibold text-gray-900 dark:text-white mb-3">Kiểm tra File (MD5)</h4>
                    <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-900 p-2 rounded-lg border border-gray-200 dark:border-gray-700">
                      <code className="text-xs text-gray-600 dark:text-gray-400 font-mono truncate flex-1">{item.md5 || "N/A"}</code>
                      <button onClick={handleCopy} className="p-1.5 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 transition-colors">
                        {copied ? <CheckIcon className="w-4 h-4 text-green-500" /> : <CopyIcon className="w-4 h-4" />}
                      </button>
                    </div>
                    {copied && <p className="text-xs text-green-500 mt-2 font-medium">Đã sao chép!</p>}
                  </div>
                  <div className="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 shadow-sm">
                    <h4 className="text-sm font-semibold text-gray-900 dark:text-white mb-3">Lịch sử phiên bản</h4>
                    <ul className="space-y-3">
                      {item.changelog.map((log, idx) => (
                        <li key={idx} className="border-b border-gray-100 dark:border-gray-700 pb-2 last:border-0 last:pb-0">
                          <div className="flex justify-between items-center mb-1">
                            <span className="text-xs font-semibold text-gray-800 dark:text-gray-200">{log.version}</span>
                            <span className="text-[10px] text-gray-500">{log.date}</span>
                          </div>
                          <p className="text-[11px] text-gray-600 dark:text-gray-400">{log.notes}</p>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
            
            <div className="p-4 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 flex justify-end gap-3">
              <button onClick={onClose} className="px-5 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Đóng</button>
              <a href={item.downloadUrl} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-2 px-6 rounded-lg font-medium transition-all shadow-md">
                <Download className="w-4 h-4" /><span>Tải Ngay</span>
              </a>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [darkMode, setDarkMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("Tất cả");
      const [isLoading, setIsLoading] = useState(true);
      const [selectedItem, setSelectedItem] = useState(null);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      useEffect(() => {
        const timer = setTimeout(() => setIsLoading(false), 800);
        return () => clearTimeout(timer);
      }, []);

      const filteredData = useMemo(() => {
        return softwareData.filter(item => {
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                item.description.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCategory = activeCategory === "Tất cả" || item.category === activeCategory;
          return matchesSearch && matchesCategory;
        });
      }, [searchQuery, activeCategory]);

      return (
        <div className="min-h-screen flex flex-col font-sans">
          <Header darkMode={darkMode} setDarkMode={setDarkMode} />

          <main className="flex-1">
            <section className="relative pt-20 pb-16 px-4 overflow-hidden">
              <div className="absolute inset-0 bg-blue-50/50 dark:bg-blue-900/10 -z-10 transition-colors"></div>
              <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-64 bg-blue-400/20 dark:bg-blue-600/20 blur-[100px] rounded-full -z-10"></div>
              
              <div className="container mx-auto max-w-4xl text-center">
                <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-6">
                  Công Cụ Dữ Liệu <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-500">Y Tế & BHYT</span>
                </h1>
                <p className="text-lg md:text-xl text-gray-600 dark:text-gray-400 mb-10 max-w-2xl mx-auto">
                  Kho phần mềm chuyên dụng hỗ trợ kiểm tra XML, chuẩn hóa dữ liệu 130 và đồng bộ cổng giám định BHYT hiệu quả nhất.
                </p>

                <div className="relative max-w-2xl mx-auto mb-10 group">
                  <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
                    <SearchIcon className="w-5 h-5" />
                  </div>
                  <input 
                    type="text" 
                    className="w-full pl-14 pr-12 py-4 rounded-2xl border-2 border-white dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm shadow-xl shadow-blue-500/5 dark:shadow-blue-900/10 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all text-lg"
                    placeholder="Tìm kiếm nhanh phần mềm, tính năng..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  {searchQuery && (
                    <div className="absolute inset-y-0 right-0 pr-4 flex items-center">
                      <button onClick={() => setSearchQuery("")} className="p-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-400 transition-colors"><XIcon className="w-5 h-5" /></button>
                    </div>
                  )}
                </div>

                <div className="flex flex-wrap justify-center gap-3">
                  {categories.map(cat => (
                    <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 ${activeCategory === cat ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900 shadow-lg transform scale-105' : 'bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 shadow-sm'}`}>
                      {cat}
                    </button>
                  ))}
                </div>
              </div>
            </section>

            <section className="py-8 px-4 container mx-auto max-w-7xl">
              <div className="mb-8 flex justify-between items-end">
                <div>
                  <h2 className="text-2xl font-bold text-gray-900 dark:text-white">Danh sách phần mềm</h2>
                  <p className="text-gray-500 dark:text-gray-400 mt-1">Hiển thị {isLoading ? "..." : filteredData.length} kết quả</p>
                </div>
              </div>

              {isLoading ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {[1, 2, 3].map(i => <SkeletonCard key={i} />)}
                </div>
              ) : filteredData.length > 0 ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredData.map(item => <SoftwareCard key={item.id} item={item} onOpenModal={setSelectedItem} />)}
                </div>
              ) : (
                <div className="text-center py-20 bg-white dark:bg-gray-900 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                  <div className="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                    <SearchIcon className="w-8 h-8" />
                  </div>
                  <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-2">Không tìm thấy phần mềm nào</h3>
                  <button onClick={() => {setSearchQuery(""); setActiveCategory("Tất cả");}} className="mt-4 px-6 py-2.5 bg-blue-50 dark:bg-blue-900/30 text-blue-600 font-medium rounded-xl hover:bg-blue-100 transition-colors">Xóa bộ lọc</button>
                </div>
              )}
            </section>
          </main>
          <footer className="border-t border-gray-200 dark:border-gray-800 py-8 bg-white dark:bg-gray-950 mt-auto"><div className="container mx-auto px-4 text-center text-gray-500 text-sm"><p>© 2024 HealthXML. All rights reserved.</p></div></footer>
          <Modal isOpen={!!selectedItem} onClose={() => setSelectedItem(null)} item={selectedItem} />
        </div>
      );
    };

    // Error Boundary Component
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return <div style={{padding:'20px', color:'red'}}><h1>Lỗi Render React:</h1><p>{this.state.error.toString()}</p></div>;
        return this.props.children;
      }
    }

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    } catch (err) {
      document.body.innerHTML += '<div style="color:red;padding:20px;">Lỗi khởi tạo React: ' + err.message + '</div>';
    }
  </script>
</body>
</html>
